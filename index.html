  <!-- OneSignal Web SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "ccd1d73b-a787-4144-a805-855f14907e27",
        serviceWorkerParam: { scope: "/Campus-app/" },
        serviceWorkerPath: "Campus-app/OneSignalSDKWorker.js"
      });

      // Escuta a chegada do Push para exibir o banner vermelho no topo
      OneSignal.Notifications.addEventListener("foregroundWillDisplay", function(event) {
        const notification = event.notification;
        const titulo = notification.title || "🚨 ALERTA DE EMERGÊNCIA";
        const mensagem = notification.body || "Protocolo ativado na central.";
        ativarBannerVisual(titulo, mensagem);
      });
    });

    // Função para solicitar permissão ao clicar no botão do menu hambúrguer
    async function solicitarPermissaoNotificacoes() {
      if (window.OneSignalDeferred) {
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.Notifications.requestPermission();
          } catch (err) {
            console.error("Erro ao solicitar permissão:", err);
            showToast("Não foi possível solicitar a permissão.", "⚠️");
          }
        });
      }
    }
  </script>
