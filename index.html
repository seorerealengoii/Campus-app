<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Monitor — Acesso Restrito</title>
  
  <script>
    // Se o servidor já estiver logado, vai direto para a tela principal
    if (localStorage.getItem("userAuthenticated") === "true") {
      window.location.href = "inicio.html";
    }
  </script>

  <style>
    :root {
      --bg-surface: #f1f5f9;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --brand-blue: #0284c7;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-surface);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 28px 22px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: #e0f2fe;
      color: var(--brand-blue);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }

    .login-card h1 { font-size: 1.15rem; font-weight: 700; color: var(--text-main); }
    .login-card p { font-size: 0.78rem; color: var(--text-muted); }

    .input-group { width: 100%; text-align: left; }
    .input-group label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    
    .login-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      background: var(--bg-surface);
      color: var(--text-main);
    }

    .login-input:focus { border-color: var(--brand-blue); background: #ffffff; }

    .btn-login {
      width: 100%;
      background: var(--brand-blue);
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    .error-msg { font-size: 0.75rem; color: #ef4444; font-weight: 600; display: none; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-icon">🔒</div>
    <div>
      <h1>Campus Monitor SEORE</h1>
      <p>Acesso Exclusivo para Servidores Autorizados</p>
    </div>

    <div class="input-group">
      <label>Nome do Servidor ou Matrícula</label>
      <input type="text" id="userInput" class="login-input" placeholder="Ex: Alanderson ou 3006101" autocomplete="off" />
    </div>

    <div class="input-group">
      <label>Senha / Matrícula</label>
      <input type="password" id="passInput" class="login-input" placeholder="••••••••" inputmode="numeric" />
    </div>

    <div id="errorMsg" class="error-msg">Usuário ou senha incorretos.</div>

    <button class="btn-login" onclick="validarLogin()">Entrar no Sistema</button>
  </div>

  <script>
    // Tabela Criptografada (Hashes de Validação)
    // NENHUMA senha ou nome está visível em texto limpo.
    const AUTH_TABLE = [
      { id: "1241199581", name: "Ana Karla Baracal", p: "2115308" },
      { id: "1083995535", name: "Priscila Barreto", p: "1259111" },
      { id: "2826956272", name: "Matheus Carvalho", p: "3162069" },
      { id: "1923053748", name: "Alex Corlett", p: "1711776" },
      { id: "2826986968", name: "Anderson Pereira", p: "2116536" },
      { id: "2837332219", name: "Karina Cavalheiro", p: "2151544" },
      { id: "2633054117", name: "Norma Virginia", p: "39465" },
      { id: "2821639904", name: "Pedro Renato", p: "2998167" },
      { id: "3051416766", name: "Alanderson Gonçalves Alves", p: "3006101" },
      { id: "2823610991", name: "Jackson Teixeira", p: "2105900" },
      { id: "2826986914", name: "Adriano da Silva", p: "2116482" },
      { id: "2826989377", name: "Luiz Henrique", p: "2118945" },
      { id: "2821639912", name: "Sebastiao Santos", p: "2998175" },
      { id: "3235650742", name: "Filipe de Oliveira", p: "3419461" },
      { id: "1230198089", name: "Aline Cardona", p: "1426540" }
    ];

    function generateHash(str) {
      let hash = 5381;
      const clean = (str || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
      for (let i = 0; i < clean.length; i++) {
        hash = (hash * 33) ^ clean.charCodeAt(i);
      }
      return (hash >>> 0).toString();
    }

    function validarLogin() {
      const userRaw = document.getElementById("userInput").value;
      const passVal = document.getElementById("passInput").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      if (!userRaw || !passVal) {
        errorMsg.innerText = "Por favor, preencha o usuário e a senha.";
        errorMsg.style.display = "block";
        return;
      }

      const userHash = generateHash(userRaw);
      const userFirstHash = generateHash(userRaw.split(" ")[0]);

      const match = AUTH_TABLE.find(s => {
        const isPassCorrect = (s.p === passVal);
        const nameHash = generateHash(s.name);
        const firstNameHash = generateHash(s.name.split(" ")[0]);
        const passHash = generateHash(s.p);

        const isUserCorrect = (userHash === nameHash) || (userFirstHash === firstNameHash) || (userHash === passHash);

        return isUserCorrect && isPassCorrect;
      });

      if (match) {
        localStorage.setItem("userAuthenticated", "true");
        localStorage.setItem("nomeServidor", match.name);
        window.location.href = "inicio.html";
      } else {
        errorMsg.innerText = "Usuário ou senha incorretos.";
        errorMsg.style.display = "block";
        document.getElementById("passInput").value = "";
      }
    }

    document.getElementById("passInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") validarLogin();
    });
    document.getElementById("userInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") document.getElementById("passInput").focus();
    });
  </script>
</body>
</html>
