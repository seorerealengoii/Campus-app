<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEORE Pátio Digital — Encaminhamento Médico</title>
  <meta name="theme-color" content="#f1f5f9">

  <script>
    if (localStorage.getItem("userAuthenticated") !== "true") {
      window.location.href = "index.html";
    }
  </script>

  <style>
    :root {
      --bg-surface: #f1f5f9;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --brand-blue: #0284c7;
      --brand-blue-light: #e0f2fe;
      --amber-bg: #fef3c7;
      --amber-border: #f59e0b;
      --amber-text: #92400e;
      --green-bg: #dcfce7;
      --green-border: #86efac;
      --green-text: #166534;
      --purple-bg: #f3e8ff;
      --purple-border: #a855f7;
      --purple-text: #6b21a8;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-surface);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 14px;
    }

    .app-container {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 90px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px;
      background: #fee2e2; color: #dc2626;
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .brand-text h1 { font-size: 0.95rem; font-weight: 800; }
    .brand-text p { font-size: 0.72rem; font-weight: 600; color: var(--brand-blue); }

    .header-actions { display: flex; gap: 6px; }
    .btn-top {
      background: var(--bg-surface); border: 1px solid var(--border-color);
      border-radius: 10px; padding: 7px 10px; font-size: 0.78rem;
      font-weight: 700; color: var(--text-main); text-decoration: none; cursor: pointer;
    }

    .card-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .card-box.highlight { border: 1.5px solid var(--brand-blue); }

    .section-title { font-size: 0.88rem; font-weight: 800; color: var(--text-main); }
    .form-label {
      display: block; font-size: 0.7rem; font-weight: 800;
      color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px;
    }

    .clean-input, .clean-select {
      width: 100%; padding: 11px 12px; border-radius: 10px;
      border: 1px solid var(--border-color); background: var(--bg-surface);
      font-size: 0.85rem; font-weight: 600; color: var(--text-main);
      font-family: inherit; outline: none;
    }
    .clean-input:focus, .clean-select:focus { border-color: var(--brand-blue); background: #fff; }

    .row-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }

    .quick-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .q-chip {
      background: var(--bg-surface); border: 1px solid var(--border-color);
      border-radius: 14px; padding: 5px 10px; font-size: 0.71rem;
      font-weight: 600; color: var(--text-main); cursor: pointer;
    }
    .q-chip:active { background: var(--brand-blue-light); border-color: var(--brand-blue); }

    .btn-primary {
      background: var(--brand-blue); color: #fff; border: none;
      border-radius: 11px; padding: 13px; font-size: 0.88rem;
      font-weight: 800; cursor: pointer; width: 100%;
    }

    .ref-item {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--amber-border);
      border-radius: 12px;
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .ref-item.st-EM_ATENDIMENTO { border-left-color: var(--brand-blue); background: #f0f9ff; }
    .ref-item.st-LIBERADO_SALA { border-left-color: #16a34a; background: #f0fdf4; }
    .ref-item.st-LIBERADO_CASA { border-left-color: var(--purple-border); background: #faf5ff; }

    .ref-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .ref-aluno { font-size: 0.9rem; font-weight: 800; }
    .ref-turma {
      background: var(--card-bg); border: 1px solid var(--border-color);
      padding: 2px 7px; border-radius: 6px; font-size: 0.7rem; font-weight: 800;
    }

    .badge-st {
      font-size: 0.66rem; font-weight: 800; padding: 3px 8px;
      border-radius: 999px; white-space: nowrap;
    }
    .badge-ENCAMINHADO { background: var(--amber-bg); color: var(--amber-text); }
    .badge-EM_ATENDIMENTO { background: var(--brand-blue-light); color: var(--brand-blue); }
    .badge-LIBERADO_SALA { background: var(--green-bg); color: var(--green-text); }
    .badge-LIBERADO_CASA { background: var(--purple-bg); color: var(--purple-text); }

    .ref-meta { font-size: 0.74rem; color: var(--text-muted); line-height: 1.35; }
    .ref-obs-posto {
      font-size: 0.73rem; font-weight: 600; color: var(--text-main);
      background: rgba(255,255,255,0.8); padding: 5px 8px; border-radius: 7px;
    }

    .toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: #0f172a; color: #fff; padding: 10px 18px;
      border-radius: 12px; font-size: 0.78rem; font-weight: 700;
      opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 2000;
    }
    .toast.show { opacity: 1; }

    .bottom-nav {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 480px;
      background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(8px);
      border: 1px solid var(--border-color); border-radius: 20px;
      padding: 8px 16px; display: flex; justify-content: space-around; align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06); z-index: 900;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-decoration: none;
    }
    .nav-item.active { color: var(--brand-blue); }
    .nav-icon { font-size: 1.1rem; }
  </style>
</head>
<body>

  <div class="toast" id="toastMsg">Salvo!</div>

  <div class="app-container">
    <header>
      <div class="brand">
        <div class="brand-icon">🏥</div>
        <div class="brand-text">
          <h1>Posto Médico</h1>
          <p>Autorização de Saída • SEORE</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-top" onclick="carregarEncaminhamentos(true)">🔄</button>
        <a href="inicio.html" class="btn-top">← Início</a>
      </div>
    </header>

    <!-- FORMULÁRIO DE AUTORIZAÇÃO -->
    <section class="card-box highlight">
      <div class="section-title">🩺 Autorizar Ida ao Posto Médico</div>

      <div class="row-2">
        <div>
          <label class="form-label" for="inpAluno">Nome do Aluno</label>
          <input type="text" id="inpAluno" class="clean-input" placeholder="Ex: João Pedro Silva" />
        </div>
        <div>
          <label class="form-label" for="selTurma">Turma</label>
          <select id="selTurma" class="clean-select">
            <option value="">Selecione...</option>
            <optgroup label="Fundamental">
              <option>601</option><option>602</option><option>603</option><option>604</option><option>606</option>
              <option>701</option><option>702</option><option>703</option><option>704</option><option>705</option>
              <option>801</option><option>802</option><option>803</option><option>804</option><option>805</option>
              <option>901</option><option>902</option><option>903</option><option>904</option><option>906</option>
            </optgroup>
            <optgroup label="Médio Regular">
              <option>1101</option><option>1103</option><option>1105</option><option>1107</option>
              <option>2102</option><option>2104</option><option>2106</option><option>2108</option>
              <option>1201</option><option>1203</option><option>1205</option><option>1207</option>
              <option>2202</option><option>2204</option><option>2206</option>
              <option>1301</option><option>1303</option><option>1305</option><option>1307</option><option>1309</option>
              <option>2302</option>
            </optgroup>
            <optgroup label="Integrado">
              <option>IM 1209</option><option>IM 2112</option><option>AD 2110</option>
              <option>AD 2208</option><option>IM 2306</option><option>AD 1311</option>
            </optgroup>
          </select>
        </div>
      </div>

      <div>
        <label class="form-label" for="inpMotivo">Queixa / Motivo do Encaminhamento</label>
        <div class="quick-chips">
          <button type="button" class="q-chip" onclick="setMotivo('Dor de cabeça')">+ Dor de cabeça</button>
          <button type="button" class="q-chip" onclick="setMotivo('Enjoo / Dor abdominal')">+ Enjoo / Barriga</button>
          <button type="button" class="q-chip" onclick="setMotivo('Cólica')">+ Cólica</button>
          <button type="button" class="q-chip" onclick="setMotivo('Queda / Machucado na Ed. Física')">+ Machucado Ed. Física</button>
          <button type="button" class="q-chip" onclick="setMotivo('Tontura / Mal-estar')">+ Mal-estar</button>
        </div>
        <input type="text" id="inpMotivo" class="clean-input" placeholder="Descreva brevemente o motivo..." />
      </div>

      <button type="button" class="btn-primary" id="btnEnviar" onclick="enviarEncaminhamento()">
        ✅ Autorizar e Enviar para o Posto
      </button>
    </section>

    <!-- ACOMPANHAMENTO EM TEMPO REAL -->
    <section class="card-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="section-title">📋 Encaminhados Hoje (<span id="totalHoje">0</span>)</div>
        <a href="posto_medico.html" target="_blank" style="font-size:0.72rem; font-weight:700; color:var(--brand-blue); text-decoration:none;">Abrir tela do Posto ↗</a>
      </div>
      <div id="listaEncaminhados" style="display:flex; flex-direction:column; gap:8px;">
        <div style="font-size:0.8rem; color:var(--text-muted); text-align:center; padding:14px;">Carregando registros...</div>
      </div>
    </section>
  </div>

  <nav class="bottom-nav">
    <a href="inicio.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>Início</span>
    </a>
    <a href="professores.html" class="nav-item">
      <span class="nav-icon">🧭</span>
      <span>Grade</span>
    </a>
    <a href="encaminhamento.html" class="nav-item active">
      <span class="nav-icon">🏥</span>
      <span>Posto</span>
    </a>
    <a href="monitor.html" class="nav-item">
      <span class="nav-icon">📊</span>
      <span>Monitor</span>
    </a>
  </nav>

  <script>
    const API_POSTO_URL = "https://script.google.com/macros/s/AKfycbyzvuBIlDgUQQ2Cx811OVb3xNU9idvUPSUIcu40ANdXyAqjoaKs7Bs_kc5fUUDWG3ZY/exec";

    const STATUS_INFO = {
      ENCAMINHADO: { label: "🟡 A caminho do Posto", cls: "badge-ENCAMINHADO" },
      EM_ATENDIMENTO: { label: "🔵 No Posto Médico", cls: "badge-EM_ATENDIMENTO" },
      LIBERADO_SALA: { label: "🟢 Retornou à Sala", cls: "badge-LIBERADO_SALA" },
      LIBERADO_CASA: { label: "🏠 Liberado p/ Responsável", cls: "badge-LIBERADO_CASA" }
    };

    function showToast(msg) {
      const t = document.getElementById("toastMsg");
      t.innerText = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2400);
    }

    function setMotivo(txt) {
      const inp = document.getElementById("inpMotivo");
      inp.value = inp.value ? `${inp.value} • ${txt}` : txt;
    }

    async function enviarEncaminhamento() {
      const aluno = document.getElementById("inpAluno").value.trim();
      const turma = document.getElementById("selTurma").value;
      const motivo = document.getElementById("inpMotivo").value.trim();
      const servidor = (localStorage.getItem("nomeServidor") || "SEORE").split(" ")[0];

      if (!aluno || !turma) {
        showToast("⚠️ Preencha o nome do aluno e a turma.");
        return;
      }

      const btn = document.getElementById("btnEnviar");
      btn.disabled = true;
      btn.innerText = "⏳ Enviando autorização...";

      try {
        await fetch(API_POSTO_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "criar",
            aluno: aluno,
            turma: turma,
            motivo: motivo || "Não especificado",
            autorizadoPor: servidor
          })
        });

        document.getElementById("inpAluno").value = "";
        document.getElementById("selTurma").value = "";
        document.getElementById("inpMotivo").value = "";
        showToast("✅ Aluno autorizado no sistema do Posto!");
        await carregarEncaminhamentos(false);
      } catch (err) {
        showToast("⚠️ Erro ao conectar com a planilha.");
      } finally {
        btn.disabled = false;
        btn.innerText = "✅ Autorizar e Enviar para o Posto";
      }
    }

    async function carregarEncaminhamentos(manual = false) {
      try {
        const res = await fetch(`${API_POSTO_URL}?t=${Date.now()}`);
        const data = await res.json();
        const lista = data.registros || [];

        document.getElementById("totalHoje").innerText = lista.length;
        const container = document.getElementById("listaEncaminhados");

        if (lista.length === 0) {
          container.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted); text-align:center; padding:16px;">Nenhum aluno encaminhado hoje até o momento.</div>`;
          return;
        }

        container.innerHTML = lista.map(r => {
          const st = STATUS_INFO[r.status] || STATUS_INFO.ENCAMINHADO;
          const chegadaTxt = r.horaChegada ? ` • Chegou às <b>${r.horaChegada}</b>` : "";
          const altaTxt = r.horaAlta ? ` • Alta às <b>${r.horaAlta}</b>` : "";
          const obsHtml = r.obsPosto ? `<div class="ref-obs-posto">🩺 Posto: ${r.obsPosto}</div>` : "";

          return `
            <div class="ref-item st-${r.status}">
              <div class="ref-top">
                <div>
                  <span class="ref-aluno">${r.aluno}</span>
                  <span class="ref-turma">Turma ${r.turma}</span>
                </div>
                <span class="badge-st ${st.cls}">${st.label}</span>
              </div>
              <div class="ref-meta">
                <b>Motivo:</b> ${r.motivo}<br>
                Saída SEORE às <b>${r.horaSaida}</b> (${r.autorizadoPor})${chegadaTxt}${altaTxt}
              </div>
              ${obsHtml}
            </div>
          `;
        }).join("");

        if (manual) showToast("✅ Lista atualizada!");
      } catch (err) {
        if (manual) showToast("⚠️ Falha na atualização.");
      }
    }

    window.onload = () => {
      carregarEncaminhamentos(false);
      setInterval(() => carregarEncaminhamentos(false), 15000);
    };
  </script>
</body>
</html>
